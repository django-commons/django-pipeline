[tox]
envlist =
    pypy3-dj{41,42,50,51,52,60,61,main}
    py{39,310}-dj40
    py{39,310,311}-dj41
    py{39,310,311,312}-dj42
    py{310,311,312,313,314}-dj{50,51,52}
    py{312,313,314}-dj60
    py{312,313,314,315}-dj{61,main}
    docs

[testenv]
basepython =
    pypy3: pypy3.12
    py39: python3.9
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
    py315: python3.15
deps =
    -r dev-requirements.txt
    dj40: Django>=4.0,<4.1
    dj41: Django>=4.1,<4.2
    dj42: Django>=4.2,<4.3
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz

setenv =
    # PyPy has no C tracer, and its Python tracer breaks Django's LazyObject.
    pypy3: COVERAGE_CORE = sysmon

commands =
    npm install
    {envbindir}/pytest --cov=pipeline --cov-report=term --cov-report=xml {posargs:tests}

whitelist_externals = npm

ignore_outcome =
    djmain: True

ignore_errors =
    djmain: True

allowlist_externals=npm

[testenv:docs]
basepython = python3.14
changedir = docs
deps =
    -r doc-requirements.txt
commands =
    {envbindir}/sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html
