name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: build (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', 'pypy-3.10']
        django-version: ['4.1', '4.2', '5.0', '5.1', '5.2', 'main']
        exclude:
          - python-version: '3.9'
            django-version: '5.0'
          - python-version: '3.9'
            django-version: '5.1'
          - python-version: '3.9'
            django-version: '5.2'
          - python-version: '3.9'
            django-version: 'main'
          - python-version: 'pypy-3.10'
            django-version: '4.1'
          - python-version: 'pypy-3.10'
            django-version: '4.2'
          - python-version: 'pypy-3.10'
            django-version: '5.0'
          - python-version: 'pypy-3.10'
            django-version: '5.1'
          - python-version: 'pypy-3.10'
            django-version: '5.2'
          - python-version: 'pypy-3.10'
            django-version: 'main'
          - python-version: '3.12'
            django-version: '4.1'
          - python-version: '3.13'
            django-version: '4.1'
          - python-version: '3.13'
            django-version: '4.2'
          - python-version: '3.13'
            django-version: '5.0'
          - python-version: '3.13'
            django-version: '5.1'

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 26

    - name: Install Node dependencies
      run: npm install

    - name: Get pip cache dir
      id: pip-cache
      run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

    - name: Cache
      uses: actions/cache@v5.1.0
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key:
          ${{ matrix.python-version }}-v1-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/tox.ini') }}
        restore-keys: |
          ${{ matrix.python-version }}-v1-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade tox tox-gh-actions

    - name: Tox tests
      run: |
        tox -v
      env:
        DJANGO: ${{ matrix.django-version }}

    - name: Upload coverage
      if: always()
      uses: codecov/codecov-action@v7.1.1
      with:
        name: Python ${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/ruff-action@v4.1.0
