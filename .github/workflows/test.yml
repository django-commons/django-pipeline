name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  envs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.envs.outputs.matrix }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: List tox environments
      id: envs
      shell: python
      run: |
        import json, os, re, subprocess

        envs = subprocess.check_output(
            ["pipx", "run", "tox", "list", "--no-desc", "-d"],
            text=True,
        ).split()
        include = []

        for env in envs:
            m = re.match(r"py(\d)(\d+)-", env)

            if m:
                python = f"{m[1]}.{m[2]}"
            elif env.startswith("pypy3"):
                python = "pypy-3.12"
            else:
                # The docs env uses basepython = python3.9.
                python = "3.9"

            include.append({"tox-env": env, "python-version": python})

        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"matrix={json.dumps({'include': include})}\n")

  build:
    name: build (${{ matrix.tox-env }})
    needs: envs
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.envs.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Set up Node
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 26

    - name: Install Node dependencies
      run: npm install

    - name: Get pip cache dir
      id: pip-cache
      run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

    - name: Cache
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key:
          ${{ matrix.python-version }}-v1-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/tox.ini') }}
        restore-keys: |
          ${{ matrix.python-version }}-v1-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade tox tox-gh-actions

    - name: Tox tests
      run: |
        python -m tox -v -e "$TOX_ENV"
      env:
        TOX_ENV: ${{ matrix.tox-env }}

    - name: Upload coverage
      if: always()
      uses: codecov/codecov-action@v7.1.1
      with:
        name: Python ${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Ruff
      uses: astral-sh/ruff-action@v4.1.0
    - name: Typos
      uses: crate-ci/typos@v1.52.2
