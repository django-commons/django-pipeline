name: Release

on:
  push:
    tags:
      # Order matters. The last rule that applies to a tag
      # is the one that takes effect.
      - '*'
      # Never publish dev tags to PyPI.
      - '!*.dev*'

env:
  PYPI_URL: https://pypi.org/p/django-pipeline

permissions: {}

jobs:
  build:
    name: Build distribution
    # Prevent this workflow from running on forks.
    if: github.repository == 'django-commons/django-pipeline'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # setuptools-scm needs the full history and tags to set the version.
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish distribution to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: ${{ env.PYPI_URL }}
    permissions:
      id-token: write  # Required for trusted publishing.
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Upload distribution to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating GitHub Releases.

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        "${GITHUB_REF_NAME}"
        --repo '${{ github.repository }}'
        --draft
        --generate-notes
    - name: Upload artifact to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        "${GITHUB_REF_NAME}" dist/**
        --repo '${{ github.repository }}'
