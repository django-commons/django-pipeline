name: Test release to TestPyPI

on:
  workflow_dispatch:
# Manual runs only. Nobody has access to the django-pipeline project on
# TestPyPI yet. Restore the schedule and tag triggers once that is fixed:
#
#  schedule:
#    # Run on the second day of every month.
#    - cron: "12 3 2 * *"
#  push:
#    tags:
#      - '*'

env:
  PYPI_TEST_URL: https://test.pypi.org/p/django-pipeline

permissions: {}

jobs:
  build:
    name: Build distribution
    # Prevent this workflow from running on forks.
    if: github.repository == 'django-commons/django-pipeline'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # setuptools-scm needs the full history and tags to set the version.
        # Untagged commits get a unique .devN version.
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish distribution to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: ${{ env.PYPI_TEST_URL }}
    permissions:
      id-token: write  # Required for trusted publishing.

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        # Reruns with no new commits build the same version.
        skip-existing: true
